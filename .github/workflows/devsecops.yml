name: DevSecOps CI/CD Pipeline (Improved)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  # ==========================================
  # CI JOB 1: SAST Scan (Semgrep)
  # ==========================================
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  # ==========================================
  # CI JOB 2: Code Quality (Pylint)
  # ==========================================
  pylint-check:
    name: Pylint Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint Check
        run: pylint --fail-under=9.0 app.py

  # ==========================================
  # CI JOB 3: Dependency Vulnerability Check
  # ==========================================
  dependency-check:
    name: pip-audit Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install and Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  # ==========================================
  # CI JOB 4: Trivy Filesystem Scan
  # ==========================================
  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ==========================================
  # CI JOB 5: Build + Trivy Image Scan
  # ==========================================
  trivy-image-scan:
    name: Trivy Docker Image Scan
    needs: [sast-scan, pylint-check, dependency-check, trivy-fs-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t secure-flask-app:test .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-flask-app:test"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ==========================================
  # CD STAGE: Deploy ke K3s di VM
  # ==========================================
  deploy-to-k3s:
    name: Build & Deploy to K3s
    needs: [trivy-image-scan]
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t secure-flask-app:latest .

      - name: Import Image ke K3s (containerd)
        run: |
          docker save secure-flask-app:latest -o /tmp/flask-app.tar
          sudo k3s ctr images import /tmp/flask-app.tar
          rm -f /tmp/flask-app.tar

      - name: Deploy ke Kubernetes
        run: |
          sudo k3s kubectl apply -f k8s-deployment.yaml
          sudo k3s kubectl rollout restart deployment/flask-app
          sudo k3s kubectl rollout status deployment/flask-app --timeout=60s

      - name: Verifikasi Deployment
        run: |
          echo "=== Pods ==="
          sudo k3s kubectl get pods -l app=flask-app
          echo ""
          echo "=== Service ==="
          sudo k3s kubectl get svc flask-service
          echo ""
          echo "=== Test Akses ==="
          sleep 5
          curl -s http://localhost:30050 | head -20 || echo "Menunggu pod ready..."
